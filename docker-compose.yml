version: '3.8'

services:
  
  # 1: AEGIS KERNEL (QUANTITATIVE ENGINE & EXECUTION)
 
  aegis_kernel:
    build: .
    container_name: aegis_kernel
    restart: always
    
    # Force l'heure de New York (Crucial pour la synchro des marchés)
    environment:
      - TZ=America/New_York
      
    # Injection sécurisée des clés API (Alpaca, Mistral, Discord)
    env_file:
      - .env
      
    # Persistance (Synchronisation du code et des logs en direct)
    volumes:
      - ./:/app
      
    # Protection Anti-Saturation Disque (Empêche l'erreur "No space left")
    logging:
      driver: "json-file"
      options:
        max-size: "10m"   # Max 10 Mo par fichier de log
        max-file: "3"     # Garde uniquement les 3 derniers
        
    # Commande de lancement du moteur autonome
    command: python aegis_bot.py
    
    # Sécurité Financière : Laisse 30s au bot pour finir un ordre API avant de le forcer à s'éteindre lors d'une mise à jour
    stop_grace_period: 30s
    
    networks:
      - aegis_net

  # 2: AEGIS TERMINAL (MONITORING & HUD)

  aegis_terminal:
    build: .
    container_name: aegis_terminal
    restart: always
    
    environment:
      - TZ=America/New_York
      
    env_file:
      - .env
      
    # Exposition du port Web pour l'interface graphique
    ports:
      - "8501:8501"
      
    # Partage du même volume pour lire le fichier aegis_production.log généré par le Kernel
    volumes:
      - ./:/app
      
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        
    # Commande de lancement du Dashboard
    command: streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0 --logger.level=error
    
    # S'assure que le Terminal démarre APRES le Kernel
    depends_on:
      - aegis_kernel
      
    networks:
      - aegis_net


# RÉSEAU ISOLÉ (Sécurité interne)

networks:
  aegis_net:
    driver: bridge
